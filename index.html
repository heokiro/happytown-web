<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <!-- 휴대폰: 화면 가득, 확대 막기, 노치 영역까지 -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 아이폰 '홈 화면에 추가'로 열면 주소창 없이 전체화면 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="행복한 마을">
    <meta name="theme-color" content="#FFF6E0">
    <title>행복한 마을</title>
    <link rel="icon" type="image/png" href="TemplateData/favicon.png">
    <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <img id="unity-logo" src="TemplateData/icon-192.png" alt="">
        <div id="unity-progress"><div id="unity-progress-full"></div></div>
        <div id="unity-loading-text">불러오는 중…</div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      // 아이폰 옆면 무음 스위치를 켜 두어도 게임 소리가 나게(iOS 17+ Safari). 지원하지 않는 브라우저는 그냥 넘어간다
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}

      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var progressFull = document.querySelector("#unity-progress-full");
      var warning = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement("div");
        div.textContent = msg;
        if (type == "error") div.className = "error";
        warning.appendChild(div);
        warning.style.display = "block";
        if (type != "error") setTimeout(function () {
          warning.removeChild(div);
          if (!warning.children.length) warning.style.display = "none";
        }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "HappyTown_unity",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // 아이폰은 화면 배율이 3이라 그대로 그리면 무겁다: 2배까지만(2D 그림이라 차이가 거의 없다)
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      loading.style.display = "flex";
      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressFull.style.width = 100 * progress + "%";
        }).then(function () {
          loading.style.display = "none";
        }).catch(function (message) {
          unityShowBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
